name: Keep Supabase Active

on:
  schedule:
    - cron: "0 5 * * *" # 08:00 EEST (05:00 UTC) every day
  workflow_dispatch: # Allow manual triggering

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        run: |
          curl --fail --retry 10 -X POST "${{ secrets.KEEP_ALIVE_URL }}?ownerId=${{ secrets.OWNER_ID }}"
